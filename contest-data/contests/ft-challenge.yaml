schemaVersion: 1
id: ft-challenge
metadata:
  name: "International FT Challenge"
  organizer: "RTTYcontesting.com"
  description: "Successor of the discontinued FT Roundup. First full weekend of December, 1800 UTC Saturday to 2359 UTC Sunday; only the first 24 hours of operation are scored. FT8 and FT4, 80-10 m. Exchange: signal report (SNR) + 4-character grid square. QSO points: 1 + 1 per full 3000 km between grid centres. Multipliers: 2-character grid fields per band (ZZ does not count). Each station once per band, FT4 or FT8. Simplified: the 24-hour scoring window is not enforced."
  officialUrl: "https://www.rttycontesting.com/ft-challenge/rules/"
period: { durationHours: 30, startWeekday: SAT, startTime: "1800" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [FT8, FT4]

exchange:
  sent:
    - { id: snr,  type: TEXT,    source: MANUAL }        # e.g. -03
    - { id: grid, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: snr,  type: TEXT,    required: true, validation: { regex: "^[+-]?[0-9]{1,2}$" } }
    - { id: grid, type: LOCATOR, required: true, validation: { regex: "^[A-R]{2}[0-9]{2}$" }, estimate: grid }

scoring:
  qsoPoints:
    mode: SUM
    default: 1
    rules:
      - { when: {}, value: { fixed: 1 } }
      - { when: {}, value: { perKm: { field: grid, factor: 0.0003333333333, round: FLOOR, min: 0 } } }  # +1 per 3000 km
  total: "qsoPoints * multTotal"

multipliers:
  - { id: fields, set: grid_fields, from: grid, scope: PER_BAND }

dupe: { scope: PER_BAND }

cabrillo: { contestName: FT-CHALLENGE, sentOrder: [snr, grid], receivedOrder: [snr, grid] }
ui:
  entryOrder: [call, snr, grid]
  logColumns: [time, call, band, mode, snr, grid, points, mult]
