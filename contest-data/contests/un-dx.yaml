schemaVersion: 1
id: un-dx
metadata:
  name: "UN DX Contest"
  organizer: "Kazakhstan Federation of Radio Sports and Radioamateur"
  description: "0600-2059 UTC on a Saturday in May (16 May in 2026); 80-10 m CW and SSB. Kazakh stations send RS(T) + KDA district (letter + two digits, e.g. L17), others RS(T) + serial. Points: QSO with Kazakhstan 10; otherwise own country 2 (non-UN entrants), different country on own continent 3, other continent 5. Multipliers per band: KDA districts + DXCC countries. Same station once per band per mode. Simplification: KDA districts are an open set (format check only); the Cabrillo sent exchange is written for a non-UN entrant (RST + serial)."
  officialUrl: "https://undxc.kz/rules-eng/"
period: { durationHours: 15, startWeekday: SAT, startTime: "0600" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]

stationClasses:
  - { id: un, when: { entityIn: [130] } }
  - { id: dx, when: { not: { entityIn: [130] } } }

exchange:
  sent:
    - { id: rst,    type: RST,    source: AUTO_RST }
    - { id: nr,     type: SERIAL, source: AUTO_SERIAL }
    - { id: mydist, type: TEXT,   source: FROM_STATION }   # Kazakh stations only: own KDA district (not written to Cabrillo)
  received:
    - { id: rst,      type: RST,      required: true }
    - { id: district, type: DISTRICT, required: true, appliesWhen: { workedClass: un },
        validation: { regex: "^[A-Z][0-9]{2}$" } }
    - { id: nr,       type: SERIAL,   required: true, appliesWhen: { workedClass: dx } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 0
    rules:
      - { when: { workedClass: un },      value: { fixed: 10 } }   # any station working Kazakhstan (also UN-UN)
      - { when: { ownDxcc: true },        value: { fixed: 2 } }
      - { when: { sameContinent: true },  value: { fixed: 3 } }
      - { when: { otherContinent: true }, value: { fixed: 5 } }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: districts, set: kda_districts, from: district, scope: PER_BAND, appliesWhen: { workedClass: un } }
  - { id: countries, set: dxcc_entities, from: callsign, scope: PER_BAND }

dupe: { scope: PER_BAND_MODE }

cabrillo: { contestName: UN-DX, sentOrder: [rst, nr], receivedOrder: [rst, district, nr] }
ui:
  entryOrder: [call, district, nr]
  logColumns: [time, call, band, mode, rst, district, nr, points, mult]
