schemaVersion: 1
id: ha-dx
metadata:
  name: "HA-DX Contest"
  organizer: "MRASZ (Hungarian Radio Amateur Society)"
  description: "24 h from Saturday 1200 UTC, 3rd full weekend of January. HA stations send RS(T) + county (20 codes), others RS(T) + serial. Everyone works everyone; points: HA station 10, own continent 2, other continent 5. Multipliers per band regardless of mode: DXCC countries (except HA) + Hungarian counties. A station may be worked once per band, in MIX categories once per band per mode. Simplifications: WAE-only countries (e.g. IT9, GM/Shetland) count as their DXCC entity; /AM and /MM (2 points, no multiplier) are not recognised; the Cabrillo sent exchange is written for a non-HA entrant (RST + serial)."
  officialUrl: "https://ha-dx.com/en/contest-rules"
period: { durationHours: 24, startWeekday: SAT, startTime: "1200" }
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]

stationClasses:
  - { id: ha, when: { entityIn: [239] } }
  - { id: dx, when: { not: { entityIn: [239] } } }

exchange:
  sent:
    - { id: rst,    type: RST,    source: AUTO_RST }
    - { id: nr,     type: SERIAL, source: AUTO_SERIAL }
    - { id: mycounty, type: TEXT, source: FROM_STATION }   # HA stations only: own county (not written to Cabrillo)
  received:
    - { id: rst,    type: RST,      required: true }
    - { id: county, type: DISTRICT, required: true, appliesWhen: { workedClass: ha },
        validation: { regex: "^[A-Z]{2}$" } }
    - { id: nr,     type: SERIAL,   required: true, appliesWhen: { workedClass: dx } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 0
    rules:
      - { when: { workedClass: ha },      value: { fixed: 10 } }
      - { when: { sameContinent: true },  value: { fixed: 2 } }
      - { when: { otherContinent: true }, value: { fixed: 5 } }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: counties,  set: ha_counties,   from: county,   scope: PER_BAND, appliesWhen: { workedClass: ha } }
  - { id: countries, set: dxcc_entities, from: callsign, scope: PER_BAND, appliesWhen: { workedClass: dx } }

dupe: { scope: PER_BAND_MODE }

cabrillo: { contestName: HA-DX, sentOrder: [rst, nr], receivedOrder: [rst, county, nr] }
ui:
  entryOrder: [call, county, nr]
  logColumns: [time, call, band, mode, rst, county, nr, points, mult]
operating:
  rules:
  # MS: the run station stays 10 minutes on a new band.
  - when:
      OPERATOR: "MULTI-OP"
    bandChange:
      minimumMinutes: 10
