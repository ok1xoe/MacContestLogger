schemaVersion: 1
id: iaru-r1-microwave
metadata:
  name: "IARU Region 1 UHF/Microwave Contest (1.3-10 GHz)"
  organizer: "IARU Region 1"
  description: "Microwave bands of the October UHF/Microwave contest (432 MHz is in iaru-r1-uhf). RS(T) + serial (per band from 001) + 6-char locator; points = distance in km truncated + 1. Simplified: each band is a separate entry in the rules, here the points of all bands are summed; bands above 10 GHz (millimetre group) do not exist in the app."
  officialUrl: "https://www.iaru-r1.org/wp-content/uploads/2026/09/Rules-IARU-R1-VHF-up-Contests.pdf"
# first weekend of October, 1400 UTC Saturday to 1400 UTC Sunday
period: { durationHours: 24, startWeekday: SAT, startTime: "1400" }
bands: [23cm, 13cm, 9cm, 6cm, 3cm]
modes: [CW, SSB, FM]

exchange:
  sent:
    - { id: rst, type: RST,     source: AUTO_RST }
    - { id: nr,  type: SERIAL,  source: AUTO_SERIAL }
    - { id: loc, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: rst, type: RST,     required: true }
    - { id: nr,  type: SERIAL,  required: true }
    - { id: loc, type: LOCATOR, required: true, validation: { regex: "^[A-Ra-r]{2}[0-9]{2}[A-Xa-x]{2}$" } }

scoring:
  qsoPoints:
    mode: SUM
    default: 1
    rules:
      - { when: {}, value: { fixed: 1 } }
      - { when: {}, value: { perKm: { field: loc, factor: 1, round: FLOOR, min: 0 } } }
  total: "qsoPoints"

numbering: { perBand: true }
dupe: { scope: PER_BAND }

cabrillo: { contestName: IARU-R1-UHF, sentOrder: [rst, nr, loc], receivedOrder: [rst, nr, loc] }
ui:
  entryOrder: [call, nr, loc]
  logColumns: [time, call, band, mode, rst, nr, loc, points]
