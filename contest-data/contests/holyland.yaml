schemaVersion: 1
id: holyland
metadata:
  name: "World Wide Holyland Contest"
  organizer: "IARC (Israel Amateur Radio Club)"
  description: "Friday 2100 UTC - Saturday 2059 UTC, 3rd full weekend of April; 80-10 m CW and SSB. 4X/4Z stations send RS(T) + Area (grid square + region, e.g. F15TA), others RS(T) + serial. Points outside Israel: 4X/4Z station 8, other continent 4, same continent 2, own country 1; in Israel: QSO with DX 8, same continent (Asia) 2, 4X-4X 1. Multipliers per band regardless of mode: Areas + DXCC countries (Israel included). Same station once per band per mode. Simplifications: Areas are an open set (format check only); /MM (4 points, no multiplier) not recognised; for 4X entrants the rules do not say 'per band' for Areas, counted per band here; the Cabrillo sent exchange is written for a non-4X entrant (RST + serial)."
  officialUrl: "https://tools.iarc.org/wwhc/#/rules"
period: { durationHours: 24, startWeekday: FRI, startTime: "2100" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]

stationClasses:
  - { id: s4x, when: { entityIn: [336] } }
  - { id: dx,  when: { not: { entityIn: [336] } } }

exchange:
  sent:
    - { id: rst,    type: RST,    source: AUTO_RST }
    - { id: nr,     type: SERIAL, source: AUTO_SERIAL }
    - { id: myarea, type: TEXT,   source: FROM_STATION }   # 4X/4Z only: own Area (not written to Cabrillo)
  received:
    - { id: rst,  type: RST,      required: true }
    - { id: area, type: DISTRICT, required: true, appliesWhen: { workedClass: s4x },
        validation: { regex: "^[A-Z][0-9]{2}[A-Z]{2}$" } }
    - { id: nr,   type: SERIAL,   required: true, appliesWhen: { workedClass: dx } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 0
    rules:
      # I am in Israel
      - { when: { ownEntityIn: [336], workedClass: s4x },    value: { fixed: 1 } }
      - { when: { ownEntityIn: [336], sameContinent: true }, value: { fixed: 2 } }
      - { when: { ownEntityIn: [336] },                      value: { fixed: 8 } }
      # I am outside Israel
      - { when: { workedClass: s4x },      value: { fixed: 8 } }
      - { when: { ownDxcc: true },         value: { fixed: 1 } }
      - { when: { otherContinent: true },  value: { fixed: 4 } }
      - { when: { sameContinent: true },   value: { fixed: 2 } }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: areas,     set: holyland_areas, from: area,     scope: PER_BAND, appliesWhen: { workedClass: s4x } }
  - { id: countries, set: dxcc_entities,  from: callsign, scope: PER_BAND }

dupe: { scope: PER_BAND_MODE }

cabrillo: { contestName: HOLYLAND, sentOrder: [rst, nr], receivedOrder: [rst, area, nr] }
ui:
  entryOrder: [call, area, nr]
  logColumns: [time, call, band, mode, rst, area, nr, points, mult]
