schemaVersion: 1
id: cq-wpx-rtty
metadata:
  name: "CQ WW RTTY WPX Contest"
  organizer: "CQ Magazine"
period: { durationHours: 48 }
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [RTTY]

# WPX RTTY: výměna je jen RST + pořadové číslo (stejně jako CW/SSB WPX). QSO řádek
# Cabrilla nenese stát/oblast — násobič jsou prefixy. RTTY navíc boduje i spojení
# ve vlastní zemi (pokryto pravidlem sameContinent).
exchange:
  sent:
    - { id: rst, type: RST,    source: AUTO_RST }
    - { id: nr,  type: SERIAL, source: AUTO_SERIAL }
  received:
    - { id: rst, type: RST,    required: true }
    - { id: nr,  type: SERIAL, required: true }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 1
    rules:
      # vlastní země (v RTTY se boduje i vlastní země/kontinent)
      - { when: { ownDxcc: true, bandIn: [160m, 80m, 40m] }, value: { fixed: 2 } }
      - { when: { ownDxcc: true },                           value: { fixed: 1 } }
      # jiný kontinent
      - { when: { otherContinent: true, bandIn: [160m, 80m, 40m] }, value: { fixed: 6 } }
      - { when: { otherContinent: true },                           value: { fixed: 3 } }   # 20/15/10
      # stejný kontinent, jiná země
      - { when: { sameContinent: true, bandIn: [160m, 80m, 40m] }, value: { fixed: 4 } }
      - { when: { sameContinent: true },                           value: { fixed: 2 } }   # 20/15/10
  total: "qsoPoints * multTotal"

multipliers:
  - { id: prefixes, set: wpx_prefixes, from: callsign, scope: ONCE }   # WPX = prefix jednou za závod

dupe: { scope: PER_BAND }

cabrillo: { contestName: CQ-WPX-RTTY, sentOrder: [rst, nr], receivedOrder: [rst, nr] }
ui:
  entryOrder: [call, nr]
  logColumns: [time, call, band, mode, rst, nr, points, mult]
