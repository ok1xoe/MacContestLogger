schemaVersion: 1
id: cwops-cw-open
metadata:
  name: "CWops CW Open"
  organizer: "CWops"
  description: "First Saturday of September, three separate 4-hour sessions (0000-0359, 1200-1559, 2000-2359 UTC), each scored separately. Exchange: serial number + name, 1 point per QSO, each station once per band per session. The official multiplier (each different call sign in a session) cannot be counted by the program, so the score shown is QSO points only; serial numbers do not restart at 001 in each session automatically. The gaps between sessions are not enforced (sessions are modelled as continuous 4-hour blocks from 0000 UTC)."
  officialUrl: "https://cwops.org/cw-open/"
period:
  durationHours: 24
  startWeekday: SAT
  startTime: "0000"
  sessions: { start: "0000", minutes: 240, resetMultipliers: true }
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW]

exchange:
  sent:
    - { id: nr,   type: SERIAL, source: AUTO_SERIAL }
    - { id: name, type: TEXT,   source: FROM_STATION }
  received:
    - { id: nr,   type: SERIAL, required: true }
    - { id: name, type: TEXT,   required: true }

scoring:
  qsoPoints: { mode: FIRST_MATCH, default: 1 }
  total: "qsoPoints"            # x unique calls per session - not representable

dupe: { scope: PER_BAND }

cabrillo: { contestName: CW-OPEN, sentOrder: [nr, name], receivedOrder: [nr, name] }
ui:
  entryOrder: [call, nr, name]
  logColumns: [time, call, band, nr, name, points]
