schemaVersion: 1
id: all-asian-dx-ssb
metadata:
  name: "All Asian DX Contest — Phone"
  organizer: "JARL"
  description: "48 h from 0000 UTC, Phone: 1st Saturday of September. Exchange RS(T) + operator age (multi-op: average age; 01 when not given). Asian stations: Asian QSO 3/2/2/1 points (160/80/10/other bands), non-Asian QSO 9/6/6/3, same entity 0; multipliers DXCC entities per band. Non-Asian stations work only Asia: 3/2/2/1 points, multipliers Asian WPX prefixes per band. Simplification: maritime-mobile rules are not modelled."
  officialUrl: "https://www.jarl.org/English/4_Library/A-4-3_Contests/aadx_eng.html"
period: { durationHours: 48, startWeekday: SAT, startTime: "0000" }
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [SSB]

stationClasses:
  - { id: asia, when: { continentIs: AS } }
  - { id: dx,   when: { not: { continentIs: AS } } }

exchange:
  sent:
    - { id: rst, type: RST,  source: AUTO_RST }
    - { id: age, type: TEXT, source: FROM_STATION }      # operator age, or 01
  received:
    - { id: rst, type: RST,  required: true }
    - { id: age, type: TEXT, required: true, validation: { regex: "^[0-9]{2,3}$" } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 0
    rules:
      - { when: { ownDxcc: true }, value: { fixed: 0 } }
      # I am in Asia
      - { when: { ownContinentIs: AS, continentIs: AS, bandIn: [160m] },      value: { fixed: 3 } }
      - { when: { ownContinentIs: AS, continentIs: AS, bandIn: [80m, 10m] },  value: { fixed: 2 } }
      - { when: { ownContinentIs: AS, continentIs: AS },                      value: { fixed: 1 } }
      - { when: { ownContinentIs: AS, bandIn: [160m] },                       value: { fixed: 9 } }
      - { when: { ownContinentIs: AS, bandIn: [80m, 10m] },                   value: { fixed: 6 } }
      - { when: { ownContinentIs: AS },                                       value: { fixed: 3 } }
      # I am outside Asia: only QSOs with Asia count
      - { when: { continentIs: AS, bandIn: [160m] },     value: { fixed: 3 } }
      - { when: { continentIs: AS, bandIn: [80m, 10m] }, value: { fixed: 2 } }
      - { when: { continentIs: AS },                     value: { fixed: 1 } }
  total: "qsoPoints * multTotal"

multipliers:
  # Asian entrant: DXCC entities per band (own entity excluded)
  - { id: countries, set: dxcc_entities, from: callsign, scope: PER_BAND,
      when: { allOf: [ { ownContinentIs: AS }, { not: { ownDxcc: true } } ] } }
  # Non-Asian entrant: Asian WPX prefixes per band
  - { id: prefixes, set: wpx_prefixes, from: callsign, scope: PER_BAND, appliesWhen: { workedClass: asia },
      when: { not: { ownContinentIs: AS } } }

dupe: { scope: PER_BAND }

cabrillo: { contestName: AADX-SSB, sentOrder: [rst, age], receivedOrder: [rst, age] }
ui:
  entryOrder: [call, age]
  logColumns: [time, call, band, mode, rst, age, points, mult]
operating:
  rules:
  # Multi-op single TX: CQ WW style 10-minute rule.
  - when:
      OPERATOR: "MULTI-OP"
      TRANSMITTER: "ONE"
    bandChange:
      minimumMinutes: 10
