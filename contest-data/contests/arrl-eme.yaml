schemaVersion: 1
id: arrl-eme
metadata:
  name: "ARRL International EME Contest"
  organizer: "ARRL"
  description: "Four full weekends, 0000 UTC Saturday to 2359 UTC Sunday: weekends 1 and 2 for 2.3 GHz and up (2026: 8-9 August, 5-6 September), weekends 3 and 4 for 50-1296 MHz (2026: 31 October-1 November, 28-29 November); one log for all weekends. All QSOs via the EME path, any mode. Exchange: 4-character grid square (analog stations may send a signal report instead). Each station once per band regardless of mode. 100 points per QSO; multipliers: grid squares on each band. Score = QSO points x multipliers. Simplified: the period covers one weekend (start a new log section per weekend or extend the end); bands the program does not know (222 MHz, 902 MHz, 24 GHz and up) cannot be logged."
  officialUrl: "https://www.arrl.org/eme-contest"
period: { durationHours: 48, startWeekday: SAT, startTime: "0000" }
bands: [6m, 2m, 70cm, 23cm, 13cm, 9cm, 6cm, 3cm]
modes: [CW, SSB, FM, DIGITAL, FT8, Q65, JT65]

exchange:
  sent:
    - { id: grid, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: grid, type: LOCATOR, required: false, validation: { regex: "^[A-Ra-r]{2}[0-9]{2}$" } }   # or a report

scoring:
  qsoPoints: { mode: FIRST_MATCH, default: 100 }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: grids, set: grid_squares, from: grid, scope: PER_BAND }

dupe: { scope: PER_BAND }

cabrillo: { contestName: ARRL-EME, sentOrder: [grid], receivedOrder: [grid] }
ui:
  entryOrder: [call, grid]
  logColumns: [time, call, band, mode, grid, points, mult]
