schemaVersion: 1
id: darc-wag
metadata:
  name: "Worked All Germany (WAG) Contest"
  organizer: "DARC"
  description: "1500 UTC Saturday - 1459 UTC Sunday, 3rd full weekend of October; 80-10 m CW and SSB (respect the JOTA contest-free segments). QSOs only with German stations (German stations work everyone). German stations send RS(T) + DOK (NM = non-member), others RS(T) + serial. Points: outside Germany 3 per QSO; German stations: DL 1, Europe 3, DX 5. Multipliers per band and mode: outside Germany = DARC districts (first letter of the DOK; NM none); in Germany = DXCC/WAE countries. Same station once per band per mode. Simplifications: WAE-only areas and IG9/IH9 count as their DXCC entity; the Cabrillo sent exchange is written for a non-German entrant (RST + serial)."
  officialUrl: "https://www.darc.de/der-club/referate/conteste/wag-contest/en/rules/"
period: { durationHours: 24, startWeekday: SAT, startTime: "1500" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]

# Only QSOs with German stations count, except for German entrants.
workable: { anyOf: [ { entityIn: [230] }, { ownEntityIn: [230] } ] }

stationClasses:
  - { id: dl, when: { entityIn: [230] } }
  - { id: dx, when: { not: { entityIn: [230] } } }

exchange:
  sent:
    - { id: rst,   type: RST,    source: AUTO_RST }
    - { id: nr,    type: SERIAL, source: AUTO_SERIAL }
    - { id: mydok, type: TEXT,   source: FROM_STATION }   # German stations only: own DOK or NM (not written to Cabrillo)
  received:
    - { id: rst, type: RST,    required: true }
    - { id: dok, type: TEXT,   required: true, appliesWhen: { workedClass: dl },
        validation: { regex: "^[A-Z0-9]{2,8}$" } }
    - { id: nr,  type: SERIAL, required: true, appliesWhen: { workedClass: dx } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 3
    rules:
      # German entrant
      - { when: { ownEntityIn: [230], workedClass: dl },     value: { fixed: 1 } }
      - { when: { ownEntityIn: [230], continentIs: EU },     value: { fixed: 3 } }
      - { when: { ownEntityIn: [230] },                      value: { fixed: 5 } }
  total: "qsoPoints * multTotal"

multipliers:
  # outside Germany: DARC districts (first DOK letter)
  - { id: districts, set: dok_districts, from: dok, scope: PER_BAND_MODE, appliesWhen: { workedClass: dl },
      when: { not: { ownEntityIn: [230] } } }
  # German entrant: DXCC/WAE countries (Germany included)
  - { id: countries, set: dxcc_entities, from: callsign, scope: PER_BAND_MODE, when: { ownEntityIn: [230] } }

dupe: { scope: PER_BAND_MODE }

cabrillo: { contestName: WAG, sentOrder: [rst, nr], receivedOrder: [rst, dok, nr] }
ui:
  entryOrder: [call, dok, nr]
  logColumns: [time, call, band, mode, rst, dok, nr, points, mult]
operating:
  rules:
  # Multi operator: band changes only every ten minutes (except to work new multipliers).
  - when:
      OPERATOR: "MULTI-OP"
    bandChange:
      minimumMinutes: 10
