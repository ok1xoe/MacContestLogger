schemaVersion: 1
id: lz-6m
metadata:
  name: "LZ International Six Meters Contest"
  organizer: "Radio Club Lovech and BFRA"
  description: "Third full weekend of June, 1400 UTC Saturday to 1359 UTC Sunday (2026: 20-21 June), 6 m, CW and SSB. Exchange RS(T) + serial + 6-character locator. Each station once regardless of mode; QSOs via repeaters, EME or VoIP do not count. Points: 1 per km. No multipliers. Only entrants with at least one confirmed QSO with a Bulgarian station are ranked."
  officialUrl: "https://vhfcontest.bfra.bg/storage/rules/attachments/eljuLfwn68C0m98BhoIunbJVPLGHEuxTL2BVFYBU.pdf"
period: { durationHours: 24, startWeekday: SAT, startTime: "1400" }
bands: [6m]
modes: [CW, SSB]

exchange:
  sent:
    - { id: rst, type: RST,     source: AUTO_RST }
    - { id: nr,  type: SERIAL,  source: AUTO_SERIAL }
    - { id: loc, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: rst, type: RST,     required: true }
    - { id: nr,  type: SERIAL,  required: true }
    - { id: loc, type: LOCATOR, required: true, validation: { regex: "^[A-Ra-r]{2}[0-9]{2}[A-Xa-x]{2}$" } }

scoring:
  qsoPoints:
    # 1 point per km
    mode: SUM
    default: 0
    rules:
      - { when: {}, value: { perKm: { field: loc, factor: 1, round: FLOOR, min: 0 } } }
  total: "qsoPoints"

dupe: { scope: ONCE }

cabrillo: { contestName: LZ-6M, sentOrder: [rst, nr, loc], receivedOrder: [rst, nr, loc] }
ui:
  entryOrder: [call, nr, loc]
  logColumns: [time, call, band, mode, rst, nr, loc, points]
