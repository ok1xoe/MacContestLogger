schemaVersion: 1
id: lz-2m-fm
metadata:
  name: "LZ 2 Meters FM Open Contest"
  organizer: "Radio Club Troyan"
  description: "Last Saturday of June and second Saturday of July, 0900-1159 UTC (2026: 27 June and 11 July; each date a separate contest), 2 m FM simplex 145.400-145.575 MHz only, maximum 100 W (low power 5 W), no repeaters; the location may not change. Exchange RS + serial + 6-character locator. Each station once in the contest. Points: 1 per km. No multipliers. QSOs with stations abroad count only if they send a log."
  officialUrl: "https://vhfcontest.bfra.bg/contest-documents/19/download"
period: { durationHours: 3, startWeekday: SAT, startTime: "0900" }
bands: [2m]
modes: [FM]

exchange:
  sent:
    - { id: rst, type: RS,      source: AUTO_RST }
    - { id: nr,  type: SERIAL,  source: AUTO_SERIAL }
    - { id: loc, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: rst, type: RS,      required: true }
    - { id: nr,  type: SERIAL,  required: true }
    - { id: loc, type: LOCATOR, required: true, validation: { regex: "^[A-Ra-r]{2}[0-9]{2}[A-Xa-x]{2}$" } }

scoring:
  qsoPoints:
    # 1 point per km
    mode: SUM
    default: 0
    rules:
      - { when: {}, value: { perKm: { field: loc, factor: 1, round: FLOOR, min: 0 } } }
  total: "qsoPoints"

dupe: { scope: ONCE }

cabrillo: { contestName: LZ-2M-FM, sentOrder: [rst, nr, loc], receivedOrder: [rst, nr, loc] }
ui:
  entryOrder: [call, nr, loc]
  logColumns: [time, call, band, mode, rst, nr, loc, points]
