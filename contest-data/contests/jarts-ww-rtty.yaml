schemaVersion: 1
id: jarts-ww-rtty
metadata:
  name: "JARL / JARTS WW RTTY Contest"
  organizer: "JARL (formerly JARTS)"
  description: "RST + operator age (multi-op: average age, 01/00/99 allowed). 2 points same continent (incl. own entity), 3 other continent. Multipliers per band: DXCC entities except JA/W/VE/VK, plus JA/W/VE/VK call areas. Simplified: call areas are approximated by the WPX prefix; maritime mobile (2 points, no multiplier) not modelled."
  officialUrl: "https://jarl.org/English/4_Library/A-4-3_Contests/rtty_rules_en.html"
# third weekend of October, 0000 UTC Saturday to 2400 UTC Sunday
period: { durationHours: 48, startWeekday: SAT, startTime: "0000" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [RTTY]

exchange:
  sent:
    - { id: rst, type: RST,     source: AUTO_RST }
    - { id: age, type: INTEGER, source: FROM_STATION }
  received:
    - { id: rst, type: RST,     required: true }
    - { id: age, type: INTEGER, required: true, validation: { min: 0, max: 99 } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 2
    rules:
      - { when: { otherContinent: true }, value: { fixed: 3 } }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: countries, set: dxcc_entities, from: callsign, scope: PER_BAND, when: { not: { entityIn: [339, 291, 1, 150] } } }
  # JA/W/VE/VK call areas (approximation: WPX prefix)
  - { id: areas, set: wpx_prefixes, from: callsign, scope: PER_BAND, when: { entityIn: [339, 291, 1, 150] } }

dupe: { scope: PER_BAND }

cabrillo: { contestName: JARTS-WW-RTTY, sentOrder: [rst, age], receivedOrder: [rst, age] }
ui:
  entryOrder: [call, age]
  logColumns: [time, call, band, mode, rst, age, points, mult]
