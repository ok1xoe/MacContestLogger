schemaVersion: 1
id: arrl-rookie-roundup-rtty
metadata:
  name: "ARRL Rookie Roundup — RTTY"
  organizer: "ARRL"
  description: "Sunday of the third full weekend of August, 1800-2359 UTC, 100 W max. Rookies (first licensed this year or in the 3 preceding years) work everybody, non-Rookies work Rookies only. Exchange: name, check (2-digit year first licensed), state/province/Mexican call area (XE1, XE2, XE3, XF1, XF4) or DX. Rookie-Rookie 2 points, Rookie-non-Rookie 1 point; each station once per band. Multipliers once per contest: US states + DC, Canadian provinces, the 5 Mexican call areas and one DX multiplier. Simplified: written for a Rookie entrant; a station counts as a Rookie when its check is 23-26 - update the window every year. Cabrillo CONTEST name is uncertain (logs go through the ARRL Rookie Roundup web form)."
  officialUrl: "https://www.arrl.org/rookie-roundup"
period: { durationHours: 6, startWeekday: SUN, startTime: "1800" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [RTTY]

exchange:
  sent:
    - { id: name, type: TEXT,    source: FROM_STATION }
    - { id: chk,  type: TEXT,    source: FROM_STATION }   # 2-digit year first licensed
    - { id: loc,  type: STATE,   source: FROM_STATION }   # state/province/XE call area/DX
  received:
    - { id: name, type: TEXT,    required: true }
    - { id: chk,  type: TEXT,    required: true, validation: { regex: "^[0-9]{2}$" } }
    - { id: loc,  type: STATE,   required: true }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 1                                    # Rookie - non-Rookie
    rules:
      # Rookie - Rookie: worked station licensed 2023-2026 (window for the 2026 events)
      - { when: { expr: "chk >= 23 && chk <= 26" }, value: { fixed: 2 } }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: areas,   set: na_areas,      from: loc, scope: ONCE, when: { entityIn: [291, 1, 6, 110] } }
  - { id: xeareas, set: xe_call_areas, from: loc, scope: ONCE, when: { entityIn: [50, 204] } }
  - { id: dx,      set: dx_flag,       from: loc, scope: ONCE, when: { not: { entityIn: [291, 1, 6, 110, 50, 204] } } }

dupe: { scope: PER_BAND }

cabrillo: { contestName: ARRL-RR-DIG, sentOrder: [name, chk, loc], receivedOrder: [name, chk, loc] }
ui:
  entryOrder: [call, name, chk, loc]
  logColumns: [time, call, band, name, chk, loc, points, mult]
