schemaVersion: 1
id: cq-ww-vhf-digi
metadata:
  name: "CQ World Wide VHF Contest — Digital"
  organizer: "CQ Magazine"
  description: "July, digital weekend (FT8, FT4, MSK144, Q65...), 1400 UTC Saturday to 1400 UTC Sunday. 6 m and 2 m. Exchange: call sign and 4-character grid locator. 1 point per QSO on 6 m, 2 points on 2 m; each station once per band. Multipliers: grid locators per band. Rovers may be worked again from a new grid (the received grid is part of the dupe check). Not representable: rover scoring per visited grid (QSO points and grids count anew in each grid the rover visits)."
  officialUrl: "https://cqww-vhf.com/rules/"
period: { durationHours: 24, startWeekday: SAT, startTime: "1400" }
bands: [6m, 2m]
modes: [FT8, FT4, Q65, JT65, DIGITAL]

exchange:
  sent:
    - { id: grid, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: grid, type: LOCATOR, required: true, validation: { regex: "^[A-R]{2}[0-9]{2}$" }, estimate: grid }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 1                                    # 6 m
    rules:
      - { when: { bandIn: [2m] }, value: { fixed: 2 } }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: grids, set: grid_squares, from: grid, scope: PER_BAND }

dupe: { scope: PER_BAND, byField: grid }

cabrillo: { contestName: CQ-VHF-DIGI, sentOrder: [grid], receivedOrder: [grid] }
ui:
  entryOrder: [call, grid]
  logColumns: [time, call, band, mode, grid, points, mult]
