schemaVersion: 1
id: makrothen-rtty
metadata:
  name: "Makrothen RTTY Contest"
  organizer: "PL259 Contest Group"
  description: "Second weekend of October, three 8-hour periods: Saturday 0000-0759, Saturday 1600-2359, Sunday 0800-1559 UTC (one combined log). RTTY, 80-10 m. Exchange: 4-character grid square, no RST. Points: distance between grid centres in km rounded down, x2 on 80 m and x1.5 on 40 m; a QSO within the same grid is worth 100 points. No multipliers; each station once per band. Simplified: the off periods between the three sessions are not enforced; QSOs shorter than 100 km (between different grids) also get 100 points; the band factor is applied to the distance before rounding down."
  officialUrl: "https://www.pl259.org/makrothen/makrothen-rules/"
period: { durationHours: 40, startWeekday: SAT, startTime: "0000" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [RTTY]

exchange:
  sent:
    - { id: grid, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: grid, type: LOCATOR, required: true, validation: { regex: "^[A-R]{2}[0-9]{2}$" }, estimate: grid }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 100
    rules:
      # min 100 = the same-grid QSO (distance 0)
      - { when: { bandIn: [80m] }, value: { perKm: { field: grid, factor: 2.0, round: FLOOR, min: 100 } } }
      - { when: { bandIn: [40m] }, value: { perKm: { field: grid, factor: 1.5, round: FLOOR, min: 100 } } }
      - { when: {},                value: { perKm: { field: grid, factor: 1.0, round: FLOOR, min: 100 } } }
  total: "qsoPoints"

dupe: { scope: PER_BAND }

cabrillo: { contestName: MAKROTHEN-RTTY, sentOrder: [grid], receivedOrder: [grid] }
ui:
  entryOrder: [call, grid]
  logColumns: [time, call, band, grid, points]
