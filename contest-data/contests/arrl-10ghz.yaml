schemaVersion: 1
id: arrl-10ghz
metadata:
  name: "ARRL 10 GHz and Up Contest"
  organizer: "ARRL"
  description: "Third full weekends of August and September, 0900 UTC Saturday to 0759 UTC Monday. North American stations; any mode, terrestrial only. Exchange: 6-character grid locator. Each QSO: distance in km between grid centres (band factor 1 on 10 GHz) + 100 points for each unique call sign per band. Only the 3 cm (10 GHz) band exists in the program, higher bands (factors 2-5) are not available. Simplified: a station may be worked again on a band only after moving 16 km - the program approximates this by allowing a re-contact when the received 6-character locator changes (the 16 km rule and the 1 km minimum cannot be checked); a re-contact earns the 100 QSO points again, the rules give distance points only. Distance is measured from my station locator, changes of my own location are not followed."
  officialUrl: "https://www.arrl.org/10-ghz-and-up"
period: { durationHours: 47, startWeekday: SAT, startTime: "0900" }
bands: [3cm]
modes: [CW, SSB, FM, AM, DIGITAL]

exchange:
  sent:
    - { id: grid, type: LOCATOR, source: FROM_STATION }
  received:
    - { id: grid, type: LOCATOR, required: true, validation: { regex: "^[A-R]{2}[0-9]{2}[A-X]{2}$" } }

workable: { continentIs: NA }

scoring:
  qsoPoints:
    mode: SUM
    default: 100
    rules:
      - { when: {}, value: { fixed: 100 } }                                           # unique call per band
      - { when: {}, value: { perKm: { field: grid, factor: 1, round: ROUND, min: 0 } } } # distance x band factor 1
  total: "qsoPoints"

dupe: { scope: PER_BAND, byField: grid }

cabrillo: { contestName: ARRL-10-GHZ, sentOrder: [grid], receivedOrder: [grid] }
ui:
  entryOrder: [call, grid]
  logColumns: [time, call, band, mode, grid, points]
