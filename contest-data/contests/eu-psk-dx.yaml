schemaVersion: 1
id: eu-psk-dx
metadata:
  name: "EU PSK DX Contest"
  organizer: "EPC (European PSK Club)"
  description: "May, 1200 UTC Saturday to 1200 UTC Sunday (2026: 16-17 May), BPSK63 only, 80-10 m, single operator only (SO-100 up to 100 W, SO-005 up to 5 W). European stations send RST + EU Area code (e.g. 599 NOTMSE), others RST + serial. Points: same DXCC country 1, same continent other country 2, other continent 3; non-European entrants get 5 points for QSOs with European stations. Multipliers per band: EU Areas + DXCC countries. Score = points x multipliers. Simplified: maritime mobile stations (3 points, no multiplier) are not recognised; the rules give no dupe rule - each station is taken once per band."
  officialUrl: "https://eupsk.club/eupskdx/eupskdxrules.pdf"
period: { durationHours: 24, startWeekday: SAT, startTime: "1200" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [PSK]

stationClasses:
  - { id: eu, when: { continentIs: EU } }
  - { id: dx, when: { not: { continentIs: EU } } }

exchange:
  sent:
    - { id: rst, type: RST,    source: AUTO_RST }
    - { id: nr,  type: SERIAL, source: AUTO_SERIAL }   # European stations: EU Area code (change the source)
  received:
    - { id: rst,  type: RST,      required: true }
    - { id: area, type: DISTRICT, required: true, appliesWhen: { workedClass: eu },
        validation: { regex: "^[A-Z0-9]{2,8}$" } }
    - { id: nr,   type: SERIAL,   required: true, appliesWhen: { workedClass: dx } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 3
    rules:
      - { when: { ownDxcc: true },                                    value: { fixed: 1 } }
      - { when: { workedClass: eu, not: { ownContinentIs: EU } },     value: { fixed: 5 } }
      - { when: { sameContinent: true },                              value: { fixed: 2 } }
  total: "qsoPoints * multTotal"

multipliers:
  - { id: areas,     set: eu_psk_areas,  from: area,     scope: PER_BAND, appliesWhen: { workedClass: eu } }
  - { id: countries, set: dxcc_entities, from: callsign, scope: PER_BAND }

dupe: { scope: PER_BAND }

cabrillo: { contestName: EU-PSK-DX, sentOrder: [rst, nr], receivedOrder: [rst, area, nr] }
ui:
  entryOrder: [call, area, nr]
  logColumns: [time, call, band, mode, rst, area, nr, points, mult]
