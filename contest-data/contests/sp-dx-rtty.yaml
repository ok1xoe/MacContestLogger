schemaVersion: 1
id: sp-dx-rtty
metadata:
  name: "SP DX RTTY Contest"
  organizer: "PK RVG (Polish Radiovideography Club) / PZK"
  description: "1200 UTC Saturday - 1200 UTC Sunday, 4th full weekend of April; RTTY on 80-10 m. Polish stations send RST + poviat code, others RST + serial. Points: own country 2, other country on own continent 5, other continent 10; QSOs with UA (Russia) and EW (Belarus) score nothing. Multipliers per band: DXCC countries (not UA/EW) + Polish poviats; the sum is multiplied by the number of continents worked (max 6, whole contest). Implementation: continents are counted by six once-per-contest bonuses (1 each), total = qsoPoints x (countries + poviats) x bonusPoints. Simplification: poviats are an open set (format check only); the Cabrillo sent exchange is written for a non-SP entrant (RST + serial)."
  officialUrl: "https://pkrvg.org/strona,spdxrttyen.html"
period: { durationHours: 24, startWeekday: SAT, startTime: "1200" }
bands: [80m, 40m, 20m, 15m, 10m]
modes: [RTTY]

# QSOs with UA (European/Asiatic Russia, Kaliningrad) and EW score 0 points and no multiplier.
workable: { not: { entityIn: [54, 15, 126, 27] } }

stationClasses:
  - { id: sp, when: { entityIn: [269] } }
  - { id: dx, when: { not: { entityIn: [269] } } }

exchange:
  sent:
    - { id: rst,    type: RST,    source: AUTO_RST }
    - { id: nr,     type: SERIAL, source: AUTO_SERIAL }
    - { id: mypov,  type: TEXT,   source: FROM_STATION }   # SP stations only: own poviat (not written to Cabrillo)
  received:
    - { id: rst,    type: RST,      required: true }
    - { id: poviat, type: DISTRICT, required: true, appliesWhen: { workedClass: sp },
        validation: { regex: "^[A-Z]{2,3}$" } }
    - { id: nr,     type: SERIAL,   required: true, appliesWhen: { workedClass: dx } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 0
    rules:
      - { when: { ownDxcc: true },        value: { fixed: 2 } }
      - { when: { sameContinent: true },  value: { fixed: 5 } }
      - { when: { otherContinent: true }, value: { fixed: 10 } }
  # continents worked (max 6): one bonus point per continent, once per contest
  bonuses:
    - { id: cont-eu, when: { continentIs: EU }, value: { fixed: 1 }, scope: ONCE }
    - { id: cont-as, when: { continentIs: AS }, value: { fixed: 1 }, scope: ONCE }
    - { id: cont-af, when: { continentIs: AF }, value: { fixed: 1 }, scope: ONCE }
    - { id: cont-na, when: { continentIs: NA }, value: { fixed: 1 }, scope: ONCE }
    - { id: cont-sa, when: { continentIs: SA }, value: { fixed: 1 }, scope: ONCE }
    - { id: cont-oc, when: { continentIs: OC }, value: { fixed: 1 }, scope: ONCE }
  total: "qsoPoints * (mult.countries + mult.poviats) * bonusPoints"

multipliers:
  - { id: countries, set: dxcc_entities, from: callsign, scope: PER_BAND }
  - { id: poviats,   set: sp_poviats,    from: poviat,   scope: PER_BAND, appliesWhen: { workedClass: sp } }

dupe: { scope: PER_BAND }

cabrillo: { contestName: SPDXC-RTTY, sentOrder: [rst, nr], receivedOrder: [rst, poviat, nr] }
ui:
  entryOrder: [call, poviat, nr]
  logColumns: [time, call, band, mode, rst, poviat, nr, points, mult]
