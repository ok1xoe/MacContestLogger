schemaVersion: 1
id: 7th-area-qso-party
metadata:
  name: "7th Call Area QSO Party (7QP)"
  organizer: "Central Oregon DX Club"
  description: "first Saturday of May, 1300 UTC Saturday to 0700 UTC Sunday. 7th-area stations (AZ, ID, MT, NV, OR, UT, WA, WY) send RS(T) + 5-letter state+county code (ORDES, AZYVP), others RS(T) + state/province or DX. 7th-area stations work everyone, others work 7th-area stations only. Phone 2 points, CW 3, digital 4; a station may be worked once per band and mode (a mobile again from every county). Multipliers once: others count the 259 7th-area counties; 7th-area stations count the 50 states (a county of 7QP, the Indiana, New England or Delaware QSO party counts as its state), 13 provinces and at most 10 other DXCC countries. In-state / out-of-state follows the ARRL section in the station data. Set ROVERQTH to your 5-letter county (7th area) or state/province (elsewhere) — it is what is sent. A county line QSO is logged as ORDES/JEF (one QSO per county). For one log of all four same-weekend QSO parties outside their areas use the combined definition (IN7QPNE)."
  officialUrl: "https://www.7qp.org/"
period: { durationHours: 18, startWeekday: SAT, startTime: "1300" }
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB, DIGITAL]

inState:
  sections: [AZ, EWA, ID, MT, NV, OR, UT, WWA, WY]

exchange:
  sent:
    - { id: rst, type: RST,  source: AUTO_RST }
    - { id: qth, type: TEXT, source: ROVER_QTH }      # my county (7th area) or state/province
  received:
    - { id: rst, type: RST,  required: true }
    - { id: qth, type: TEXT, required: true, split: true }

# 7th-area stations work anyone, others work 7th-area stations only
workable:
  anyOf:
    - { inState: true }
    - { fieldMatches: { field: qth, regex: "^(AZ|ID|MT|NV|OR|UT|WA|WY)[A-Z]{3}$" } }

scoring:
  qsoPoints:
    mode: FIRST_MATCH
    default: 4                                         # digital
    rules:
      - { when: { mode: CW }, value: { fixed: 3 } }
      - { when: { anyOf: [ { mode: SSB }, { mode: AM }, { mode: FM } ] }, value: { fixed: 2 } }
  # at most 10 DXCC countries count
  total: "qsoPoints * (mult.states + min(mult.countries, 10) + mult.counties)"

multipliers:
  # W/VE stations only (DX stations send DX)
  - { id: states,    set: qp_weekend_qth,   from: qth,      scope: ONCE,
      when: { allOf: [ { inState: true }, { entityIn: [291, 1, 6, 110] } ] } }
  - { id: countries, set: dxcc_entities,    from: callsign, scope: ONCE,
      when: { allOf: [ { inState: true }, { not: { entityIn: [291, 1, 6, 110] } } ] } }
  - { id: counties,  set: sevenqp_counties, from: qth,      scope: ONCE, when: { inState: false } }

dupe: { scope: PER_BAND_MODE, byField: qth }

cabrillo: { contestName: 7QP, sentOrder: [rst, qth], receivedOrder: [rst, qth] }
ui:
  entryOrder: [call, qth]
  logColumns: [time, call, band, mode, rst, qth, points, mult]
