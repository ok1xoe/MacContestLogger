# Syntetická „plná“ definice pro bránu JavaDefinitionParityTests (úkol 12 P3b):
# každé pole recordu naplněné, koerce (text → číslo, 1.9 → 1, yes → true),
# záporná čísla, null prvky seznamů. Není to skutečný závod.
schemaVersion: 1
id: full-a
metadata:
  name: Plný závod
  organizer: ORG
  description: "popis: s dvojtečkou"
  officialUrl: https://example.org/x
period:
  durationHours: 48
  sessions:
    start: "1200"
    minutes: "-30"
bands: [160m, 80m, ~]
modes: [CW, SSB]
categories:
  - id: SO
    label: Single
  - ~
stationClasses:
  - id: wve
    when:
      anyOf:
        - dxccIn: [K, VE]
        - continentIs: NA
          ownContinentIs: EU
      not:
        ownDxcc: false
        not: {sameDxcc: ~, bonusStation: false, dxccIn: [~, DL]}
      allOf:
        - sameDxcc: yes
          sameContinent: no
          otherContinent: true
          workedClass: dx
          bandIn: [20m]
          mode: CW
          fieldEquals: {field: state, value: ON}
          fieldPresent: zone
          expr: "zone > 3"
          bonusStation: 1
exchange:
  sent:
    - id: rst
      type: RST
      required: true
      source: AUTO_RST
    - id: nr
      type: 2
      source: AUTO_SERIAL
      estimate: "001"
  received:
    - id: zone
      type: CQ_ZONE
      required: yes
      source: MANUAL
      appliesWhen: {workedClass: wve}
      validation: {regex: "^[0-9]+$", min: -5, max: "40", length: 2.9}
      estimate: cqZone
scoring:
  qsoPoints:
    mode: SUM
    default: -1
    rules:
      - when: {sameDxcc: true}
        value: {fixed: -2}
      - when: {otherContinent: true}
        value: {expr: "3 * n"}
      - value:
          perKm: {field: locator, factor: -0.25, round: floor, min: "1", max: 1e3}
  bonuses:
    - id: b1
      when: {bonusStation: true}
      value: {fixed: 100}
      scope: ONCE
  total: qsoPoints * multTotal
  qtc: {points: 0x2, maxPerStation: -10, groupSize: "5"}
multipliers:
  - id: zones
    set: cq_zones
    from: zone
    scope: PER_BAND
    label: Zóny
    appliesWhen: {workedClass: dx}
    bandWeights: {80m: 4, 40m: "3", 20m: ~, 15m: 1.9, 10m: -1}
  - id: dxcc
    set: dxcc_entities
    from: callsign
    scope: PER_MODE
    label: ""
    bandWeights: {}
dupe:
  scope: PER_BAND_MODE
  dupeWorthZero: false
cabrillo:
  contestName: CQ-WW-CW
  sentOrder: [rst, nr]
  receivedOrder: [rst, zone]
ui:
  entryOrder: [call, rst, zone]
  logColumns: [time, call]
operating:
  offTime: {minimumMinutes: 60, requiredMinutes: -720}
  bandChange: {minimumMinutes: 10, perHour: 8}
  rules:
    - when: {OPERATOR: MULTI-OP, TRANSMITTER: ONE}
      offTime: {minimumMinutes: 30}
      bandChange: {perHour: 10}
    - {}
    - ~
