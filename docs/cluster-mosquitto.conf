# Mosquitto for the MacContestLogger cluster (network multi-op logbook).
# See docs/cluster-sync-design.md section 9.2. The broker runs as a system service; the
# cluster app and the stations are only MQTT CLIENTS pointing here.

# --- network ---
listener 1883 0.0.0.0            # listens on the whole LAN (not only localhost)

# --- durability of retained messages and sessions ---
persistence true                 # REQUIRED: retained states survive a broker restart
persistence_location /var/lib/mosquitto/
autosave_interval 30             # write the DB to disk every 30 s

# --- queues / limits ---
max_queued_messages 100000       # headroom for an offline persistent session
message_size_limit 0             # 0 = no limit (the QSO payload is small)
persistent_client_expiration 14d # how long to keep an offline session before dropping it

# --- authentication and permissions ---
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

# Creating accounts:
#   mosquitto_passwd -c /etc/mosquitto/passwd clusterserver   # cluster service account
#   mosquitto_passwd    /etc/mosquitto/passwd OP1             # account of station 1
#   mosquitto_passwd    /etc/mosquitto/passwd OP2             # account of station 2
#   ... one account per station (= the same as the stationId)

# Optionally TLS (untrusted LAN): listener 8883 + cafile/certfile/keyfile.
